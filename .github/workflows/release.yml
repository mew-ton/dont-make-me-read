name: Release

on:
  push:
    branches: [main]
    paths:
      - .claude-plugin/plugin.json
      - .github/workflows/release.yml

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Tag and release the version in plugin.json, unless it is tagged
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(jq -r '.version // empty' .claude-plugin/plugin.json)
          if [ -z "$version" ]; then
            echo "::error file=.claude-plugin/plugin.json::no version"
            exit 1
          fi
          tag="v$version"
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" > /dev/null; then
            echo "$tag is already tagged"
            exit 0
          fi
          prerelease=()
          case "$version" in *-*) prerelease=(--prerelease) ;; esac
          gh release create "$tag" --target "$GITHUB_SHA" --title "$version" \
            --generate-notes "${prerelease[@]}"
